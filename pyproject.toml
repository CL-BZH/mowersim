[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mowersim"
version = "0.1.0"
description = "Coverage path planning for a car-like robot mower: polygon lawns, Reeds-Shepp motion, coverage measured from the cutting deck"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
gif = ["pillow"]
test = ["pytest", "rsplan"]   # rsplan: an independent Reeds-Shepp implementation, used as a test oracle

[tool.setuptools]
packages = ["mowersim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
